<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arcane Week — USyd Pixel Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    /* Sandstone palette — brighter & warmer */
    --sand-50:  #FFF8E7;
    --sand-100: #FFEDC2;
    --sand-200: #FFD78A;
    --sand-300: #F2B660;
    --sand-400: #D08A3F;
    --sand-500: #A56230;
    --sand-700: #6E3F1C;
    --sand-900: #3A220F;

    /* Jacaranda — softer pastel purple */
    --jac-100: #EBD9F4;
    --jac-300: #BFA0DC;
    --jac-500: #9474C7;
    --jac-700: #6646A8;
    --jac-900: #321F5E;

    /* Grass / sky — punchier */
    --grass: #93D96F;
    --grass-dark: #62B447;
    --sky-light: #D8F0FA;
    --sky: #A0DBF0;
    --sky-dark: #5BA4CC;

    /* Stat colors */
    --energy:   #FFC851;
    --stress:   #FF7A7A;
    --prep:     #5FCBB4;

    /* Cute accents */
    --pink:     #FFAFD3;
    --pink-d:   #E07AAE;
    --mint:     #BDF2DA;
    --coral:    #FF9684;
    --sun:      #FFE36E;
    --cream:    #FFF6E2;

    /* UI neutrals — softened */
    --paper:    #FFF8E7;
    --ink:      #3A2418;
    --ink-soft: #846148;
    --line:     #4A2F1D;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: #1a1410;
    font-family: 'VT323', 'Silkscreen', monospace;
    overflow: hidden;
  }

  body {
    background:
      radial-gradient(ellipse at center, #2a2018 0%, #0c0805 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Crisp pixel rendering for everything */
  svg, img { image-rendering: pixelated; image-rendering: crisp-edges; }
  svg { shape-rendering: crispEdges; }

  .pixel-font { font-family: 'Silkscreen', monospace; }
  .pixel-tiny { font-family: 'Press Start 2P', monospace; }
  .read-font  { font-family: 'VT323', monospace; }

  #stage {
    position: relative;
    transform-origin: center center;
  }

  /* Disable text selection in the prototype */
  #stage, #stage * { user-select: none; -webkit-user-select: none; }

  /* Pixel button */
  .px-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font-family: 'Silkscreen', monospace;
    font-weight: 700;
    padding: 10px 14px;
    background: var(--sand-100);
    color: var(--ink);
    border: 3px solid var(--line);
    box-shadow: 4px 4px 0 var(--line);
    cursor: pointer;
    letter-spacing: 0.5px;
    image-rendering: pixelated;
    transition: transform 80ms, box-shadow 80ms;
  }
  .px-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--line); }
  .px-btn.primary { background: var(--jac-500); color: #fff; }
  .px-btn.danger  { background: var(--stress); color: #fff; }
  .px-btn:disabled {
    background: #c9bda4; color: #6f6553; cursor: not-allowed;
    box-shadow: 4px 4px 0 #50443a;
  }

  /* Pixel card */
  .px-card {
    background: var(--paper);
    border: 3px solid var(--line);
    box-shadow: 4px 4px 0 var(--line);
    padding: 12px;
  }

  /* Scanlines overlay — very subtle now for the cute look */
  .scanlines::after {
    content: '';
    position: absolute; inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.025) 0,
      rgba(0,0,0,0.025) 1px,
      transparent 1px,
      transparent 4px
    );
    mix-blend-mode: multiply;
  }

  /* Floating animation */
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .floaty { animation: floaty 2.4s ease-in-out infinite; }

  @keyframes blink { 0%,80%,100% { opacity:1; } 90% { opacity:0; } }
  .blink { animation: blink 3.2s steps(1,end) infinite; }

  @keyframes shimmer { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.2); } }
  .shimmer { animation: shimmer 1.6s ease-in-out infinite; }

  @keyframes popin { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .popin { animation: popin 240ms cubic-bezier(0.34, 1.56, 0.64, 1); }

  @keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
  .wiggle:hover { animation: wiggle 280ms ease-in-out; }

  /* Toast */
  .px-toast {
    position: absolute; bottom: 28px; left: 16px; right: 16px;
    background: var(--ink); color: var(--paper);
    border: 3px solid var(--line); box-shadow: 4px 4px 0 var(--jac-700);
    padding: 10px 12px; font-family: 'VT323', monospace; font-size: 16px;
    z-index: 50;
  }

  /* Native HTML inputs styled pixelly */
  input.pxinput {
    width: 100%;
    background: #fff;
    border: 3px solid var(--line);
    box-shadow: inset 2px 2px 0 #d9c89e;
    padding: 10px 12px;
    font-family: 'VT323', monospace;
    font-size: 22px;
    color: var(--ink);
    outline: none;
  }
  input.pxinput:focus { background: #fffce8; }

  /* Scrollbar (let it be invisible) */
  ::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <rect width="200" height="200" fill="#9474C7"/>
      <rect x="60" y="60" width="80" height="80" fill="#FFC851"/>
      <rect x="80" y="80" width="40" height="40" fill="#FF7A7A"/>
      <text x="100" y="180" font-family="monospace" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">ARCANE</text>
    </svg>
  </template>
  <div id="stage"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="android-frame.jsx"></script>
  <script type="text/babel" src="pixel.jsx"></script>
  <script type="text/babel" src="screens-intro.jsx"></script>
  <script type="text/babel" src="screens-map.jsx"></script>
  <script type="text/babel" src="screens-nodes.jsx"></script>
  <script type="text/babel" src="screens-meta.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <script>
    // Auto-scale stage to fit viewport
    function fit() {
      const stage = document.getElementById('stage');
      if (!stage) return;
      const rect = stage.getBoundingClientRect();
      const w = stage.offsetWidth || 1000;
      const h = stage.offsetHeight || 900;
      if (!w || !h) return;
      const scale = Math.min(window.innerWidth / w, window.innerHeight / h, 1);
      stage.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', fit);
    const ro = new ResizeObserver(fit);
    requestAnimationFrame(() => {
      const stage = document.getElementById('stage');
      if (stage) ro.observe(stage);
      fit();
    });
  </script>
</body>
</html>
